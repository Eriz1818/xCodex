name: rust-ci
on:
  pull_request: {}
  workflow_dispatch:

jobs:
  # --- Detect what changed so the fast PR workflow only runs relevant jobs ----
  changed:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      argument_comment_lint: ${{ steps.detect.outputs.argument_comment_lint }}
      argument_comment_lint_package: ${{ steps.detect.outputs.argument_comment_lint_package }}
      codex: ${{ steps.detect.outputs.codex }}
      workflows: ${{ steps.detect.outputs.workflows }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Detect changed paths (no external action)
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA='${{ github.event.pull_request.base.sha }}'
            HEAD_SHA='${{ github.event.pull_request.head.sha }}'
            echo "Base SHA: $BASE_SHA"
            echo "Head SHA: $HEAD_SHA"
            mapfile -t files < <(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")
          else
            # On manual runs, default to the full fast-PR bundle.
            files=("codex-rs/force" "tools/argument-comment-lint/force" ".github/force")
          fi

          codex=false
          argument_comment_lint=false
          argument_comment_lint_package=false
          workflows=false
          for f in "${files[@]}"; do
            [[ $f == codex-rs/* ]] && codex=true
            [[ $f == codex-rs/* || $f == tools/argument-comment-lint/* || $f == justfile ]] && argument_comment_lint=true
            [[ $f == tools/argument-comment-lint/* || $f == .github/workflows/rust-ci.yml || $f == .github/workflows/rust-ci-full.yml ]] && argument_comment_lint_package=true
            [[ $f == .github/* ]] && workflows=true
          done

          echo "argument_comment_lint=$argument_comment_lint" >> "$GITHUB_OUTPUT"
          echo "argument_comment_lint_package=$argument_comment_lint_package" >> "$GITHUB_OUTPUT"
          echo "codex=$codex" >> "$GITHUB_OUTPUT"
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"

  # --- Fast Cargo-native PR checks -------------------------------------------
  general:
    name: Format / etc
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Verify codegen for mcp-types
        run: ./mcp-types/check_lib_rs.py
      - name: Verify codegen for hooks schema/types
        shell: bash
        run: |
          set -euo pipefail

          cargo run -p codex-core --bin hooks_schema --features hooks-schema --quiet > ../docs/xcodex/hooks.schema.json
          cargo run -p codex-core --bin hooks_typescript --features hooks-schema --quiet > common/src/hooks_sdk_assets/js/xcodex_hooks.d.ts
          cargo run -p codex-core --bin hooks_python_types --features hooks-schema --quiet > common/src/hooks_sdk_assets/python/xcodex_hooks_types.py
          cargo run -p codex-core --bin hooks_python_models --features hooks-schema --quiet > common/src/hooks_sdk_assets/python/xcodex_hooks_models.py
          cargo run -p codex-core --bin hooks_python_models --features hooks-schema --quiet > ../examples/hooks/xcodex_hooks_models.py
          cargo run -p codex-core --bin hooks_go_types --features hooks-schema --quiet > common/src/hooks_sdk_assets/go/hooksdk/types.go
          cargo run -p codex-core --bin hooks_rust_sdk --features hooks-schema --quiet > hooks-sdk/src/generated.rs

          git diff --exit-code -- \
            ../docs/xcodex/hooks.schema.json \
            common/src/hooks_sdk_assets/js/xcodex_hooks.d.ts \
            common/src/hooks_sdk_assets/python/xcodex_hooks_types.py \
            common/src/hooks_sdk_assets/python/xcodex_hooks_models.py \
            ../examples/hooks/xcodex_hooks_models.py \
            hooks-sdk/src/generated.rs \
            common/src/hooks_sdk_assets/go/hooksdk/types.go

  cargo_shear:
    name: cargo shear
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2
        with:
          tool: cargo-shear
          version: 1.5.1
      - name: cargo shear
        run: cargo shear

  hooks_templates_smoke:
    name: Hooks templates smoke (docker)
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Smoke test Python template (run)
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/ws" \
            python:3.11 \
            bash -lc '
              set -euo pipefail

              CODEX_HOME="$(mktemp -d)"
              export CODEX_HOME
              mkdir -p "${CODEX_HOME}/hooks/templates/python"
              cp /ws/codex-rs/common/src/hooks_sdk_assets/python/xcodex_hooks.py "${CODEX_HOME}/hooks/"
              cp /ws/codex-rs/common/src/hooks_sdk_assets/python/xcodex_hooks_types.py "${CODEX_HOME}/hooks/"
              cp /ws/codex-rs/common/src/hooks_sdk_assets/python/xcodex_hooks_runtime.py "${CODEX_HOME}/hooks/"
              cp /ws/codex-rs/common/src/hooks_sdk_assets/python/xcodex_hooks_models.py "${CODEX_HOME}/hooks/"
              cp /ws/codex-rs/common/src/hooks_sdk_assets/python/template_hook.py "${CODEX_HOME}/hooks/templates/python/log_jsonl.py"

              payload_path="${CODEX_HOME}/payload.json"
              printf "%s" "{\"schema-version\":1,\"type\":\"tool-call-finished\",\"event-id\":\"e\",\"timestamp\":\"t\",\"thread-id\":\"th\",\"turn-id\":\"tu\",\"cwd\":\"/tmp\",\"model-request-id\":\"m\",\"attempt\":1,\"tool-name\":\"exec\",\"call-id\":\"c\",\"status\":\"completed\",\"duration-ms\":1,\"success\":true,\"output-bytes\":0,\"__marker__\":\"py\"}" > "${payload_path}"

              printf "%s" "{\"payload-path\":\"${payload_path}\"}" | python3 "${CODEX_HOME}/hooks/templates/python/log_jsonl.py"
              grep -Eq "\"__marker__\"\\s*:\\s*\"py\"" "${CODEX_HOME}/hooks.jsonl"
            '

      - name: Smoke test Node.js template (run)
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/ws" \
            node:22 \
            bash -lc '
              set -euo pipefail

              CODEX_HOME="$(mktemp -d)"
              export CODEX_HOME
              mkdir -p "${CODEX_HOME}/hooks/templates/js"
              cp /ws/codex-rs/common/src/hooks_sdk_assets/js/xcodex_hooks.mjs "${CODEX_HOME}/hooks/"
              cp /ws/codex-rs/common/src/hooks_sdk_assets/js/template_hook.mjs "${CODEX_HOME}/hooks/templates/js/log_jsonl.mjs"

              payload_path="${CODEX_HOME}/payload.json"
              printf "%s" "{\"schema-version\":1,\"type\":\"tool-call-finished\",\"event-id\":\"e\",\"timestamp\":\"t\",\"thread-id\":\"th\",\"turn-id\":\"tu\",\"cwd\":\"/tmp\",\"model-request-id\":\"m\",\"attempt\":1,\"tool-name\":\"exec\",\"call-id\":\"c\",\"status\":\"completed\",\"duration-ms\":1,\"success\":true,\"output-bytes\":0,\"__marker__\":\"node\"}" > "${payload_path}"

              printf "%s" "{\"payload-path\":\"${payload_path}\"}" | node "${CODEX_HOME}/hooks/templates/js/log_jsonl.mjs"
              grep -q "\"__marker__\":\"node\"" "${CODEX_HOME}/hooks.jsonl"
            '

      - name: Smoke test Ruby template (run)
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/ws" \
            ruby:3.3 \
            bash -lc '
              set -euo pipefail

              CODEX_HOME="$(mktemp -d)"
              export CODEX_HOME
              mkdir -p "${CODEX_HOME}/hooks/templates/ruby"
              cp /ws/codex-rs/common/src/hooks_sdk_assets/ruby/xcodex_hooks.rb "${CODEX_HOME}/hooks/"
              cp /ws/codex-rs/common/src/hooks_sdk_assets/ruby/template_hook.rb "${CODEX_HOME}/hooks/templates/ruby/log_jsonl.rb"

              payload_path="${CODEX_HOME}/payload.json"
              printf "%s" "{\"schema-version\":1,\"type\":\"tool-call-finished\",\"event-id\":\"e\",\"timestamp\":\"t\",\"thread-id\":\"th\",\"turn-id\":\"tu\",\"cwd\":\"/tmp\",\"model-request-id\":\"m\",\"attempt\":1,\"tool-name\":\"exec\",\"call-id\":\"c\",\"status\":\"completed\",\"duration-ms\":1,\"success\":true,\"output-bytes\":0,\"__marker__\":\"rb\"}" > "${payload_path}"

              printf "%s" "{\"payload-path\":\"${payload_path}\"}" | ruby "${CODEX_HOME}/hooks/templates/ruby/log_jsonl.rb"
              grep -q "\"__marker__\":\"rb\"" "${CODEX_HOME}/hooks.jsonl"
            '

      - name: Smoke test Go template (build + run)
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/ws" \
            -w /ws/codex-rs/common/src/hooks_sdk_assets/go \
            golang:1.22 \
            bash -lc '
              set -euo pipefail
              export PATH="/usr/local/go/bin:${PATH}"
              go build -o /tmp/hook ./cmd/log_jsonl

              CODEX_HOME="$(mktemp -d)"
              export CODEX_HOME
              payload_path="${CODEX_HOME}/payload.json"
              printf "%s" "{\"schema-version\":1,\"type\":\"tool-call-finished\",\"event-id\":\"e\",\"timestamp\":\"t\",\"thread-id\":\"th\",\"turn-id\":\"tu\",\"cwd\":\"/tmp\",\"model-request-id\":\"m\",\"attempt\":1,\"tool-name\":\"exec\",\"call-id\":\"c\",\"status\":\"completed\",\"duration-ms\":1,\"success\":true,\"output-bytes\":0,\"__marker__\":\"go\"}" > "${payload_path}"

              printf "%s" "{\"payload-path\":\"${payload_path}\"}" | /tmp/hook
              grep -q "\"__marker__\":\"go\"" "${CODEX_HOME}/hooks.jsonl"
            '

      - name: Smoke test Java template (build + run)
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/ws" \
            -w /ws/codex-rs/common/src/hooks_sdk_assets/java \
            maven:3.9-eclipse-temurin-17 \
            bash -lc '
              set -euo pipefail
              mvn -q -DskipTests -pl template -am package dependency:copy-dependencies

              CODEX_HOME="$(mktemp -d)"
              export CODEX_HOME
              payload_path="${CODEX_HOME}/payload.json"
              printf "%s" "{\"schema-version\":1,\"type\":\"tool-call-finished\",\"event-id\":\"e\",\"timestamp\":\"t\",\"thread-id\":\"th\",\"turn-id\":\"tu\",\"cwd\":\"/tmp\",\"model-request-id\":\"m\",\"attempt\":1,\"tool-name\":\"exec\",\"call-id\":\"c\",\"status\":\"completed\",\"duration-ms\":1,\"success\":true,\"output-bytes\":0,\"__marker__\":\"java\"}" > "${payload_path}"

              printf "%s" "{\"payload-path\":\"${payload_path}\"}" \
                | java -cp "template/target/classes:template/target/dependency/*" dev.xcodex.hooks.LogJsonlHook

              grep -q "\"__marker__\":\"java\"" "${CODEX_HOME}/hooks.jsonl"
            '

      - name: Smoke test Rust template (build + run)
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/ws" \
            -w /ws/codex-rs/common/src/hooks_sdk_assets/rust \
            rust:1.90 \
            bash -lc '
              set -euo pipefail
              cargo build --release

              CODEX_HOME="$(mktemp -d)"
              export CODEX_HOME
              payload_path="${CODEX_HOME}/payload.json"
              printf "%s" "{\"schema-version\":1,\"type\":\"tool-call-finished\",\"event-id\":\"e\",\"timestamp\":\"t\",\"thread-id\":\"th\",\"turn-id\":\"tu\",\"cwd\":\"/tmp\",\"model-request-id\":\"m\",\"attempt\":1,\"tool-name\":\"exec\",\"call-id\":\"c\",\"status\":\"completed\",\"duration-ms\":1,\"success\":true,\"output-bytes\":0,\"__marker__\":\"rust\"}" > "${payload_path}"

              printf "%s" "{\"payload-path\":\"${payload_path}\"}" \
                | ./target/release/xcodex-hooks-rust-template

              grep -q "\"__marker__\":\"rust\"" "${CODEX_HOME}/hooks.jsonl"
            '

  argument_comment_lint_package:
    name: Argument comment lint package
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ needs.changed.outputs.argument_comment_lint_package == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
      - name: Install nightly argument-comment-lint toolchain
        shell: bash
        run: |
          rustup toolchain install nightly-2025-09-18 \
            --profile minimal \
            --component llvm-tools-preview \
            --component rustc-dev \
            --component rust-src \
            --no-self-update
          rustup default nightly-2025-09-18
      - name: Cache cargo-dylint tooling
        id: cargo_dylint_cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: argument-comment-lint-${{ runner.os }}-${{ hashFiles('tools/argument-comment-lint/Cargo.lock', 'tools/argument-comment-lint/rust-toolchain', '.github/workflows/rust-ci.yml', '.github/workflows/rust-ci-full.yml') }}
      - name: Install cargo-dylint tooling
        if: ${{ steps.cargo_dylint_cache.outputs.cache-hit != 'true' }}
        run: cargo install --locked cargo-dylint dylint-link
      - name: Check Python wrapper syntax
        run: python3 -m py_compile tools/argument-comment-lint/wrapper_common.py tools/argument-comment-lint/run.py tools/argument-comment-lint/run-prebuilt-linter.py tools/argument-comment-lint/test_wrapper_common.py
      - name: Test Python wrapper helpers
        run: python3 -m unittest discover -s tools/argument-comment-lint -p 'test_*.py'
      - name: Test argument comment lint package
        working-directory: tools/argument-comment-lint
        run: cargo test

  argument_comment_lint_prebuilt:
    name: Argument comment lint - ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on || matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    needs: changed
    if: ${{ needs.changed.outputs.argument_comment_lint == 'true' || needs.changed.outputs.workflows == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            timeout_minutes: 30
          - name: macOS
            runner: macos-15-xlarge
            timeout_minutes: 30
          - name: Windows
            runner: windows-x64
            timeout_minutes: 30
            runs_on:
              group: codex-runners
              labels: codex-windows-x64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-bazel-ci
        with:
          target: ${{ runner.os }}
          install-test-prereqs: true
      - name: Install Linux sandbox build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev
      - name: Run argument comment lint on codex-rs via Bazel
        if: ${{ runner.os != 'Windows' }}
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          bazel_targets="$(./tools/argument-comment-lint/list-bazel-targets.sh)"
          ./.github/scripts/run-bazel-ci.sh \
            -- \
            build \
            --config=argument-comment-lint \
            --keep_going \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            -- \
            ${bazel_targets}
      - name: Run argument comment lint on codex-rs via Bazel
        if: ${{ runner.os == 'Windows' }}
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          ./.github/scripts/run-argument-comment-lint-bazel.sh \
            --config=argument-comment-lint \
            --platforms=//:local_windows \
            --keep_going \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA}

  auto_compact_regressions:
    name: Auto-compact regressions
    runs-on: ubuntu-24.04
    needs: changed
    if: ${{ needs.changed.outputs.codex == 'true' || needs.changed.outputs.workflows == 'true' || github.event_name == 'push' }}
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin PyO3 interpreter
        shell: bash
        run: |
          set -euo pipefail
          python -V
          echo "PYO3_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Auto-compact disabled regression tests
        run: |
          cargo test -p codex-core --test all \
            suite::compact_remote::auto_remote_compact_disabled_skips_follow_up_compaction \
            suite::compact_remote::auto_remote_compact_disabled_skips_pre_turn_compaction

  # --- Gatherer job that you mark as the ONLY required status -----------------
  results:
    name: CI results (required)
    needs:
      [
        changed,
        general,
        cargo_shear,
        hooks_templates_smoke,
        argument_comment_lint_package,
        argument_comment_lint_prebuilt,
        auto_compact_regressions,
      ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize
        shell: bash
        run: |
          echo "argpkg : ${{ needs.argument_comment_lint_package.result }}"
          echo "arglint: ${{ needs.argument_comment_lint_prebuilt.result }}"
          echo "general: ${{ needs.general.result }}"
          echo "shear  : ${{ needs.cargo_shear.result }}"
          echo "hooks  : ${{ needs.hooks_templates_smoke.result }}"
          echo "acompact: ${{ needs.auto_compact_regressions.result }}"

          # If nothing relevant changed (PR touching only root README, etc.),
          # declare success regardless of other jobs.
          if [[ '${{ needs.changed.outputs.argument_comment_lint }}' != 'true' && '${{ needs.changed.outputs.codex }}' != 'true' && '${{ needs.changed.outputs.workflows }}' != 'true' ]]; then
            echo 'No relevant changes -> CI not required.'
            exit 0
          fi

          if [[ '${{ needs.changed.outputs.argument_comment_lint_package }}' == 'true' ]]; then
            [[ '${{ needs.argument_comment_lint_package.result }}' == 'success' ]] || { echo 'argument_comment_lint_package failed'; exit 1; }
          fi

          if [[ '${{ needs.changed.outputs.argument_comment_lint }}' == 'true' || '${{ needs.changed.outputs.workflows }}' == 'true' ]]; then
            [[ '${{ needs.argument_comment_lint_prebuilt.result }}' == 'success' ]] || { echo 'argument_comment_lint_prebuilt failed'; exit 1; }
          fi

          if [[ '${{ needs.changed.outputs.codex }}' == 'true' || '${{ needs.changed.outputs.workflows }}' == 'true' ]]; then
            [[ '${{ needs.general.result }}' == 'success' ]] || { echo 'general failed'; exit 1; }
            [[ '${{ needs.cargo_shear.result }}' == 'success' ]] || { echo 'cargo_shear failed'; exit 1; }
            [[ '${{ needs.hooks_templates_smoke.result }}' == 'success' ]] || { echo 'hooks_templates_smoke failed'; exit 1; }
            [[ '${{ needs.auto_compact_regressions.result }}' == 'success' ]] || { echo 'auto_compact_regressions failed'; exit 1; }
          fi
